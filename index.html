<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Pixelwise — HDR image inspection &amp; comparison</title>
    <meta name="description" content="A precision inspection and comparison tool for HDR images, render outputs, and ML-generated images. Runs entirely in your browser." />

    <meta property="og:title" content="Pixelwise" />
    <meta property="og:description" content="HDR image inspection &amp; comparison, in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icon-1024.png" />

    <link rel="icon" type="image/png" href="icon-1024.png" />
    <link rel="apple-touch-icon" href="icon-1024.png" />

    <link data-trunk rel="copy-file" href="public/icon-1024.png" />
    <link data-trunk rel="copy-file" href="public/coi-serviceworker.js" />
    <link data-trunk rel="css" href="style/tailwind.out.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <script>
      // COOP/COEP shim so SharedArrayBuffer works on hosts (GH Pages) that
      // don't set the headers themselves. Safe no-op when already isolated.
      (function () {
        if (window.crossOriginIsolated) return;
        var s = document.createElement("script");
        s.src = "coi-serviceworker.js";
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="app-root"></div>
  </body>
</html>
