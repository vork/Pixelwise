<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0f" />

    <!-- PWA / installability -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixelwise" />

    <title>Pixelwise — HDR image inspection &amp; comparison</title>
    <meta name="description" content="A precision inspection and comparison tool for HDR images, render outputs, and ML-generated images. Runs entirely in your browser." />

    <meta property="og:title" content="Pixelwise" />
    <meta property="og:description" content="HDR image inspection &amp; comparison, in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icon-1024.png" />

    <link rel="icon" type="image/png" href="icon-1024.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <link data-trunk rel="copy-file" href="public/icon-1024.png" />
    <link data-trunk rel="copy-file" href="public/icon-512.png" />
    <link data-trunk rel="copy-file" href="public/icon-192.png" />
    <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/pwa-sw.js" />
    <link data-trunk rel="copy-file" href="public/coi-serviceworker.js" />
    <link data-trunk rel="css" href="style/tailwind.out.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <script>
      // COOP/COEP shim so SharedArrayBuffer works on hosts (GH Pages) that
      // don't set the headers themselves. Safe no-op when already isolated.
      (function () {
        if (window.crossOriginIsolated) return;
        var s = document.createElement("script");
        s.src = "coi-serviceworker.js";
        document.head.appendChild(s);
      })();

      // PWA offline caching. Only register when the page is already
      // cross-origin isolated by real server headers AND no service worker is
      // controlling yet — i.e. the COI shim above is dormant. This keeps the
      // two service workers from fighting over the same scope (which would
      // otherwise cause a reload loop on hosts that rely on the COI shim).
      (function () {
        if (
          window.crossOriginIsolated &&
          "serviceWorker" in navigator &&
          !navigator.serviceWorker.controller
        ) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("pwa-sw.js").catch(function () {});
          });
        }
      })();

      // wgpu 22 still requests `maxInterStageShaderComponents`, which Chrome
      // removed from the WebGPU spec. Strip the unrecognized key so
      // requestDevice doesn't reject with an OperationError.
      (function () {
        if (typeof GPUAdapter === "undefined") return;
        var STALE_LIMITS = ["maxInterStageShaderComponents"];
        var orig = GPUAdapter.prototype.requestDevice;
        GPUAdapter.prototype.requestDevice = function (desc) {
          if (desc && desc.requiredLimits) {
            var cleaned = {};
            for (var k in desc.requiredLimits) {
              if (STALE_LIMITS.indexOf(k) === -1) cleaned[k] = desc.requiredLimits[k];
            }
            desc = Object.assign({}, desc, { requiredLimits: cleaned });
          }
          return orig.call(this, desc);
        };
      })();
    </script>
  </head>
  <body>
    <div id="app-root"></div>
  </body>
</html>
